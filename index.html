async function open_(pw){
  const raw=Uint8Array.from(atob(D),c=>c.charCodeAt(0)),salt=raw.slice(8,16),ct=raw.slice(16);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:IT,hash:"SHA-256"},base,384));
  const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,ct);
  const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();
}
